name: release

# Builds the standalone programs for Windows and macOS (Apple Silicon and
# Intel) and attaches them to the GitHub release of a version tag (v0.2.0,
# ...). Can also be run by hand to get the zips as workflow artifacts without
# making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYINSTALLER_ARGS: >
    --noconfirm --clean --windowed --name nemnest
    --osx-bundle-identifier io.github.nemwiper.nemnest
    --collect-data nemnest --collect-all tkinterdnd2
    --exclude-module cupy --exclude-module cupyx --exclude-module torch --exclude-module pytest
    --exclude-module cryptography

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[gui,dev]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build
        shell: pwsh
        run: python -m PyInstaller $env:PYINSTALLER_ARGS.Trim().Split(" ") packaging/nemnest_gui.py
      - name: Self-test of the built program
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -Wait -FilePath dist\nemnest\nemnest.exe -ArgumentList "--selftest", "selftest.json"
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Rehearse an update (swap script)
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\upd"
          $p = Start-Process -PassThru -Wait -FilePath dist\nemnest\nemnest.exe -ArgumentList "--selftest-update", $d
          if ($p.ExitCode -ne 0) { Write-Error "could not start the update"; exit 1 }
          Start-Sleep -Seconds 15
          $inst = "$d\inst\nemnest"
          if (Test-Path "$inst\_internal\stale-file") { Write-Error "old files left behind"; exit 1 }
          if (-not (Test-Path "$inst\slicer.exe")) { Write-Error "the user's slicer.exe was removed"; exit 1 }
          if (Test-Path "$d\work") { Write-Error "work folder not removed"; exit 1 }
          if (Get-ChildItem $inst -Filter "*.old") { Write-Error "backup left behind"; exit 1 }
          $q = Start-Process -PassThru -Wait -FilePath "$inst\nemnest.exe" -ArgumentList "--selftest", "selftest2.json"
          Get-Content selftest2.json
          if ($q.ExitCode -ne 0) { Write-Error "the updated program fails its self-test"; exit 1 }
      - name: Check that the window starts
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -FilePath dist\nemnest\nemnest.exe
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "nemnest.exe exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          Copy-Item LICENSE dist\nemnest\LICENSE.txt
          Compress-Archive -Path dist\nemnest -DestinationPath "nemnest-$name-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nemnest-windows
          path: nemnest-*-windows.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[gui,dev]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller $PYINSTALLER_ARGS packaging/nemnest_gui.py
      - name: Self-test of the built program
        run: |
          status=0
          dist/nemnest.app/Contents/MacOS/nemnest --selftest selftest.json || status=$?
          cat selftest.json
          exit $status
      - name: Rehearse an update (swap script)
        run: |
          d="$RUNNER_TEMP/upd"
          dist/nemnest.app/Contents/MacOS/nemnest --selftest-update "$d"
          sleep 15
          app="$d/inst/nemnest.app"
          test ! -e "$app/Contents/Resources/stale-file" || { echo "old files left behind"; exit 1; }
          test ! -e "$d/work" || { echo "work folder not removed"; exit 1; }
          test ! -e "$d/inst/nemnest.app.old-update" || { echo "backup left behind"; exit 1; }
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/nemnest" --selftest selftest2.json
      - name: Check that the window starts
        run: |
          dist/nemnest.app/Contents/MacOS/nemnest &
          pid=$!
          sleep 20
          kill -0 $pid || { echo "nemnest exited early"; exit 1; }
          kill $pid
      - name: Zip
        run: |
          name=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo dev)
          mkdir pkg
          cp -R dist/nemnest.app pkg/
          cp LICENSE pkg/LICENSE.txt
          ditto -c -k --sequesterRsrc pkg "nemnest-$name-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nemnest-macos-${{ matrix.arch }}
          path: nemnest-*-macos-*.zip

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "nemnest $GITHUB_REF_NAME" --generate-notes
