name: release

# Builds the standalone Windows program and attaches it to the GitHub release
# of a version tag (v0.2.0, ...). Can also be run by hand to get the zip as a
# workflow artifact without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . tkinterdnd2 pyinstaller pytest
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name nemnest
          --collect-data nemnest --collect-all tkinterdnd2
          --exclude-module cupy --exclude-module cupyx --exclude-module torch --exclude-module pytest
          packaging/nemnest_gui.py
      - name: Check that the program starts
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -FilePath dist\nemnest\nemnest.exe
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "nemnest.exe exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          Copy-Item LICENSE dist\nemnest\LICENSE.txt
          Compress-Archive -Path dist\nemnest -DestinationPath "nemnest-$name-windows.zip"
          "ZIP=nemnest-$name-windows.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: nemnest-windows
          path: ${{ env.ZIP }}
      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:ZIP --title "nemnest $env:GITHUB_REF_NAME" --generate-notes
